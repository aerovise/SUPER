# tracker-drone: SUPER config for target tracking (ROS1). Copied from click_smooth_ros1.yaml;
# every changed or added line is marked "tracker-drone:". Goals and yaw targets come from target_follower.
fsm:
  click_goal_en: true
  # tracker-drone: target_follower publishes goals here (geometry_msgs/PoseStamped, world frame, <= 10 Hz).
  click_goal_topic: "/planning/click_goal"
  # tracker-drone: <= -5 disables the height override, so the follower's goal z is flown (was 1.5).
  click_height: -10.0
  # tracker-drone: new. A goal within this distance [m] of the current goal is ignored while it is
  # flown to or reached; a farther one replans toward it (moving goal). The follower adds 0.3 m hysteresis.
  regoal_dist: 0.5
  # tracker-drone: new. Point the yaw looks at in yaw_mode 3 (geometry_msgs/PointStamped, world frame).
  yaw_target_topic: "/planning/yaw_target"
  # tracker-drone: new, required with yaw_mode 3 (the node exits if missing, non-finite or <= 0).
  # Maximum age [s] of the latest odometry for the yaw_mode 3 hover command. On an odometry stall
  # (FAST_LIO stops, messages lost) no hover command is published, so PX4/px4_bridge holds instead
  # of trusting a frozen position. 0.3 s is about 3 periods at the 10 Hz preflight floor of
  # /lidar_slam/odom, so normal 10 Hz arrival gaps never trip it.
  hover_max_odom_age: 0.3
  # tracker-drone: new, required with yaw_mode 3 (the node exits if missing, non-finite or <= 0).
  # Maximum distance [m] between the robot and the latched hover point. When it fires (the drone is
  # not where the hover would hold it, or the distance is NaN) no hover command is published, so
  # PX4/px4_bridge holds instead of flying back to a stale point.
  hover_max_offset: 0.5
  # tracker-drone: new, required (the node exits if missing, non-finite or <= 0). When replans fail
  # for longer than this [s] while the goal differs from the one the flown trajectory was planned
  # for, the drone brakes along that trajectory (within traj_opt max_acc/max_jerk) and hovers where
  # it stops, then plans from rest toward the latest goal. Upstream kept flying the old trajectory
  # at speed ("force return"); with an unchanged goal it still does. 0.3 s is about 4 failed replans
  # at replan_rate 15. A hold request (hold_topic) brakes the same way at once.
  brake_after_replan_fail: 0.3
  # tracker-drone: new, required (the node exits if missing; hold_max_age must be finite and > 0).
  # geometry_msgs/PointStamped hold requests from the follower: each one stops the drone (brake
  # along the flown trajectory, or hover where it is when at rest), whatever its distance. A hold
  # stamped more than hold_max_age [s] ago is logged as stale and still applied; one stamped more
  # than that in the future, or unstamped, counts as received now. A goal stamped at or before
  # the last hold is ignored; holds are never ignored.
  hold_topic: "/planning/hold"
  hold_max_age: 0.5
  click_yaw_en: true
  replan_rate: 15.0
  cmd_topic: "/planning/pos_cmd"
  mpc_cmd_topic: "/planning_cmd/poly_traj"
  timer_en: true

super_planner:
  backup_traj_en: true
  detailed_log_en: false
  visualization_en: true
  use_fov_cut: false
  print_log: false
  visual_process: false
  frontend_in_known_free: false
  goal_yaw_en: true
  goal_vel_en: false
  corridor_bound_dis: 1.0
  corridor_line_max_length: 1.2
  safe_corridor_line_max_length: 5.0
  iris_iter_num: 2
  obs_skip_num: 2
  replan_forward_dt: 0.1
  planning_horizon: 7.0
  sensing_horizon: -1
  receding_dis: 4.0
  robot_r: 0.2
  yaw_dot_max: 3.0
  # tracker-drone: added mode 3. Yaw mode: 1 heading to velocity, 2 heading to goal, 3 look at the yaw target point
  # tracker-drone: 3, look at the target (was 1). The yaw still respects yaw_dot_max.
  # tracker-drone: yaw_mode 3 only changes /planning/pos_cmd (quadrotor_msgs/PositionCommand, cmd_topic). The
  # polynomial trajectory on mpc_cmd_topic keeps the planned trajectory yaw, so the controller
  # must track cmd_topic. After a trajectory ends at the goal, pos_cmd keeps coming at 100 Hz as a
  # hover command (final point, zero velocity) carrying the look-at yaw.
  yaw_mode: 3
  # tracker-drone: new. A yaw target older than this [s] (or none yet) falls back: while flying,
  # to the trajectory yaw (yaw_mode 1 behaviour, ending at the goal yaw), turning back at
  # yaw_dot_max; while hovering, the last yaw is held. Position is never affected. Must be > 0.
  yaw_target_timeout: 1.0
  mpc_horizon: 15


traj_opt:
  switch:
    save_log_en: false
    print_optimizer_log: false

  boundary:
    max_vel: 5.0
    max_acc: 5.0
    max_jerk: 120.0
    max_omg: 2.5
    max_acc_thr: 20.0
    min_acc_thr: 6.0
    penna_margin: 0.05

  exp_traj:
    # 1 for xi 2 for pos
    pos_constraint_type: 1
    energy_cost_type: 4
    block_energy_cost: false
    opt_accuracy: 5.0e-6
    scale_factor: 1.0
    integral_reso: 15
    smooth_eps: 0.01
    penna_t: 12000.0
    penna_pos: 5.0e+6
    penna_vel: 5.0e+5
    penna_acc: 5.0e+5
    penna_jerk: -5.0e+5
    penna_attract: 1.0e+3
    penna_omg:  5.0e+5
    penna_thr: 1.0e+5

  backup_traj:
    uniform_time_en: true
    pos_constraint_type: 1
    piece_num: 2
    energy_cost_type: 4
    block_energy_cost: true
    opt_accuracy: 1.0e-6
    scale_factor: 1.0
    integral_reso: 12
    smooth_eps: 0.01
    penna_t: 1200.0
    penna_ts: 1.0e+5
    penna_pos: 1.0e+6
    penna_vel: 1.0e+5
    penna_acc: 1.0e+5
    penna_jerk: -1.0e+5
    penna_omg: 1.0e+5
    penna_thr: 1.0e+5

  flatness:
    mass: 1.64
    dh: 0.35
    dv: 0.35
    cp: 0.001
    v_eps: 0.0001
    grav: 9.81


astar:
  map_voxel_num: [ 500, 500, 100 ]
  visual_process: false
  allow_diag: true
  # 0 DIAG; 1 MANHATTAN; 2 EUCLIDEAN
  heu_type: 2
  debug_visualization_en: false


rog_map:
  resolution: 0.1
  inflation_resolution: 0.2
  inflation_step: 2
  unk_inflation_en: false
  unk_inflation_step: 1
  map_size: [ 50,50,6 ]
  # If the map rolling is disable, the map origin [m] should be set.
  fix_map_origin: [ 0,0,1.5 ]
  frontier_extraction_en: false

  # Virtual ceil and ground
  virtual_ceil_height: 3.5
  virtual_ground_height: -0.1

  load_pcd_en: false

  map_sliding:
    enable: true
    # The minimum distance [m] to slide the map.
    threshold: 0.3

  esdf:
    enable: false
    resolution: 0.1
    # The range of esdf around the odom [m].
    local_update_box: [ 5,5,3 ]

  # If [enable = true], the ROG-Map will actively take ros topic as input.
  #  else user should call function [updateMap] to update the map.
  ros_callback:
    enable: true
    cloud_topic: "/cloud_registered"
    odom_topic: "/lidar_slam/odom"
    odom_timeout: 2.0


  visualization:
    enable: true
    # when enabled, use rqt_reconfigure to change the visualization parameters.
    use_dynamic_reconfigure: false
    # The rate of visualization [Hz], if set to 0, the visualization will not be triggered by frame.
    time_rate: 2
    # The frame rate of visualization [Hz], if set to 0, the visualization will not be triggered by frame.
    frame_rate: 0
    # visualization range along the odom [m].
    range: [ 15, 15,4 ]
    frame_id: "world"
    pub_unknown_map_en: false

  # Intensity filter for input point cloud. If the point intensity is less than this value,
  # it will be ignored (to avoid noise like dusk).
  intensity_thresh: -10
  # The temporal downsample rate for input point cloud.
  #  e.g. if set to k, the point cloud will be downsampled to 1/k.
  point_filt_num: 1

  # Probabilistc update
  raycasting:
    # if disable, the map will only maintain occupied information, and all other grid
    # will be considered as unknown.
    enable: false
    batch_update_size: 1
    local_update_box: [ 100,100,5 ]
    # The range of raycasting [m].
    ray_range: [0.5, 100 ]

    p_min: 0.12
    p_miss: 0.49
    p_free: 0.499
    p_occ: 0.85
    p_hit: 0.9
    p_max: 0.98
    # The threshold of a non-occupied inf map grid to be considered as free. [0.0-1.0]
    # for counter map, if each cell contains N cells in prob map, then only when
    # N_unk > N * unk_thresh cells are unknown, the cell will be considered as unknown.
    # example: 1) if unk_thresh is set 0.0, then once at least one cell in prob map is unknown,
    #             the cell will be considered as unknown.
    #         2) if unk_thresh is set to 1.0, then only all cells in prob map are unknown,
    #             the cell will be considered as unknown.
    # in all, 1.0 is more aggressive while 0.0 is more conservative.
    unk_thresh: 1.0

